<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyler's Profile Move</title>
    <style>
        body {
            background-color: #121212;
            color: #b0b0b0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 400px;
            padding: 2rem;
            text-align: left;
            border: 1px solid #333;
            border-radius: 8px;
        }

        h1 {
            color: #ffffff;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .discord-box {
            background-color: #1e1e1e;
            padding: 10px 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
            border: 1px solid #444;
        }

        .handle {
            font-weight: bold;
            color: #ffffff;
            font-family: monospace;
            font-size: 1.1rem;
        }

        .copy-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background-color: #444;
        }

        .copy-btn:active {
            background-color: #555;
        }

        .footer {
            margin-top: 2rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HI! I'm Tyler.</h1>
        <p>
            If you're reading this, you probably found the link on my old account's bio. 
            <strong>The Space Wolf</strong> used to be my main account but it's an Alt now.
        </p>
        
        <p>My new main account is:</p>
        
        <div class="discord-box">
            <span class="handle" id="discordHandle">thecosmicollie</span>
            <button class="copy-btn" onclick="copyText()">Copy</button>
        </div>

        <div class="footer">
            - Tyler,<br>
            CosmiCollie &lt;3
        </div>
    </div>

    <script>
        function copyText() {
            const handle = document.getElementById("discordHandle").innerText;
            navigator.clipboard.writeText(handle).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = 'Copied!';
                setTimeout(() => {
                    btn.innerText = 'Copy';
                }, 2000);
            });
        }
    </script>

</body>
</html>
